<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Dev Card Generator</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- React & Tailwind via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0d1117;
        color: #c9d1d9;
      }
      .glass-card {
        background: rgba(22, 27, 34, 0.8);
        border: 1px solid #30363d;
        backdrop-filter: blur(10px);
      }
      .btn-primary {
        background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(46, 160, 67, 0.4);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div id="root" class="w-full max-w-[600px]"></div>

    <script type="text/babel">
      const { useState } = React;
      // Determine backend base URL:
      // 1) If ?apiBase= is provided in the URL, use it (useful for testing).
      // 2) If the page is served from the run.app domain (production), use same-origin.
      // 3) Otherwise default to local backend for development.
      (function () {
        const params = new URLSearchParams(window.location.search);
        const apiBaseParam = params.get("apiBase");
        const LOCAL_DEFAULT = "http://127.0.0.1:8083";
        let detected = LOCAL_DEFAULT;
        if (apiBaseParam) {
          detected = apiBaseParam.replace(/\/+$/, "");
        } else {
          const origin = window.location.origin || window.location.href;
          // Treat the run.app deployed site as same-origin backend
          if (
            origin.includes("run.app") ||
            origin.includes("github-dev-card-174651075649")
          ) {
            detected = origin.replace(/\/+$/, "");
          }
        }
        window.BACKEND_URL = detected;
      })();

      const BACKEND_URL = window.BACKEND_URL || "http://127.0.0.1:8083";

      function App() {
        const [username, setUsername] = useState("");
        const [loading, setLoading] = useState(false);
        const [card, setCard] = useState(null);
        const [error, setError] = useState(null);
        const [copied, setCopied] = useState(false);

        const generateCard = async (e) => {
          e.preventDefault();
          if (!username.trim()) return;

          setLoading(true);
          setError(null);
          setCard(null);
          setCopied(false);

          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 120000); // 120s

            const response = await fetch(`${BACKEND_URL}/generate`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: username.trim() }),
              signal: controller.signal,
            });
            clearTimeout(timeout);

            if (!response.ok) {
              let msg = "User not found or API error";
              try {
                const err = await response.json();
                msg = err.detail || msg;
              } catch (_) {}
              throw new Error(msg);
            }

            const data = await response.json();
            if (
              data.status === "success" ||
              data.status === "partial_success"
            ) {
              setCard(data);
            } else {
              throw new Error(data.detail || "Failed to generate card");
            }
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        };

        const copyToClipboard = () => {
          if (!card) return;
          const url = `${BACKEND_URL}${card.card_url}`;
          navigator.clipboard.writeText(url);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        };

        return (
          <div class="flex flex-col items-center space-y-8 py-12">
            <div class="text-center space-y-2">
              <h1 class="text-4xl font-extrabold text-white tracking-tight sm:text-5xl">
                GitHub Dev Card
              </h1>
              <p class="text-gray-400 text-lg">
                Enter any public GitHub username
              </p>
            </div>

            <form onSubmit={generateCard} class="w-full space-y-4">
              <div class="flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  placeholder="e.g. torvalds"
                  class="flex-1 px-4 py-3 rounded-lg bg-[#0d1117] border border-[#30363d] text-white focus:outline-none focus:ring-2 focus:ring-[#2ea043] focus:border-transparent transition-all placeholder:text-gray-600"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  disabled={loading}
                />
                <button
                  type="submit"
                  disabled={loading}
                  class="btn-primary px-8 py-3 rounded-lg text-white font-bold disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
                >
                  {loading ? "Generating..." : "Generate Card"}
                </button>
              </div>
            </form>

            {error && (
              <div class="w-full p-4 rounded-lg bg-red-900/20 border border-red-500/50 text-red-200 text-center fade-in">
                ⚠️ {error}
              </div>
            )}

            {loading && (
              <div class="w-full glass-card p-8 rounded-2xl space-y-4 pulse border border-[#30363d]">
                <div class="flex items-center space-x-4">
                  <div class="w-16 h-16 bg-gray-700 rounded-full"></div>
                  <div class="space-y-2 flex-1">
                    <div class="h-4 bg-gray-700 rounded w-1/2"></div>
                    <div class="h-3 bg-gray-700 rounded w-1/4"></div>
                  </div>
                </div>
                <div class="h-20 bg-gray-700 rounded w-full mt-4"></div>
                <div class="grid grid-cols-2 gap-4">
                  <div class="h-12 bg-gray-700 rounded"></div>
                  <div class="h-12 bg-gray-700 rounded"></div>
                </div>
              </div>
            )}

            {card && (
              <div class="w-full space-y-6 fade-in">
                <div class="relative group">
                  <div dangerouslySetInnerHTML={{ __html: card.html }} />
                  <div class="mt-6 flex justify-center">
                    <button
                      onClick={copyToClipboard}
                      class="flex items-center space-x-2 px-4 py-2 rounded-full bg-[#21262d] border border-[#30363d] text-sm font-medium hover:bg-[#30363d] transition-colors text-gray-300"
                    >
                      {copied ? (
                        <span class="text-green-400 flex items-center">
                          <svg
                            class="w-4 h-4 mr-1.5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M5 13l4 4L19 7"
                            ></path>
                          </svg>
                          Copied!
                        </span>
                      ) : (
                        <span class="flex items-center">
                          <svg
                            class="w-4 h-4 mr-1.5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
                            ></path>
                          </svg>
                          Share Card URL
                        </span>
                      )}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
