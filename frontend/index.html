<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Dev Card Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: "Inter", sans-serif; background-color: #0d1117; color: #c9d1d9; }
      .glass-card { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; backdrop-filter: blur(10px); }
      .btn-primary { background: linear-gradient(135deg, #238636 0%, #2ea043 100%); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(46, 160, 67, 0.4); }
      .fade-in { animation: fadeIn 0.6s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div id="root" class="w-full max-w-[600px]"></div>

    <script type="text/babel">
      const { useState } = React;

      // PLACEHOLDER for Backend URL - will be injected by Docker at runtime
      const BACKEND_URL = "__BACKEND_URL__";

      function DevCard({ data }) {
        if (!data || !data.github_data) return null;
        const { github_data, analysis } = data;
        const theme = (analysis.card_theme || "hacker").toLowerCase();
        const themes = {
          hacker: "bg-[#0d1117] text-[#39d353] border-[#39d353]",
          builder: "bg-[#0d1117] text-[#58a6ff] border-[#58a6ff]",
          researcher: "bg-[#0d1117] text-[#bc8cff] border-[#bc8cff]",
          designer: "bg-[#0d1117] text-[#ff7b72] border-[#ff7b72]",
          "open-source-hero": "bg-[#0d1117] text-[#f0883e] border-[#f0883e]",
        };
        const themeClass = themes[theme] || themes.hacker;

        return (
          <div className={`max-w-md mx-auto rounded-2xl shadow-2xl border-2 p-8 ${themeClass} font-mono transform hover:scale-[1.02] transition-all duration-300`}>
            <div className="flex items-center space-x-6 mb-6">
              <img src={github_data.avatar_url} className="w-24 h-24 rounded-full border-4 border-current shadow-lg" alt={github_data.name} />
              <div className="overflow-hidden">
                <h2 className="text-3xl font-black tracking-tighter uppercase truncate">{github_data.name}</h2>
                <p className="text-lg opacity-80">@{github_data.name.toLowerCase().replace(/\s+/g, '')}</p>
              </div>
            </div>
            <div className="mb-6 min-h-[3rem]">
              <p className="text-lg italic leading-tight">"{analysis.developer_vibe}"</p>
            </div>
            <div className="flex flex-wrap gap-2 mb-8">
              {analysis.top_skills.map((skill, i) => (
                <span key={i} className="px-3 py-1 text-sm font-bold rounded-full border border-current uppercase">{skill}</span>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-4 mb-8">
              <div className="bg-white bg-opacity-5 p-4 rounded-xl border border-current border-opacity-20 text-center">
                <span className="block text-2xl font-bold">{github_data.public_repos}</span>
                <span className="text-xs uppercase tracking-widest opacity-60">Repositories</span>
              </div>
              <div className="bg-white bg-opacity-5 p-4 rounded-xl border border-current border-opacity-20 text-center">
                <span className="block text-2xl font-bold">{github_data.followers}</span>
                <span className="text-xs uppercase tracking-widest opacity-60">Followers</span>
              </div>
            </div>
            <div className="mb-6">
              <h3 className="text-sm font-black uppercase tracking-[0.2em] mb-4 opacity-50">Featured Projects</h3>
              <div className="space-y-3">
                {github_data.top_repos.slice(0, 3).map((repo, i) => (
                  <div key={i} className="group p-3 rounded-lg bg-white bg-opacity-5 border-l-4 border-current hover:bg-opacity-10 transition-colors">
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-sm">{repo.name}</span>
                      <span className="text-[10px]">⭐ {repo.stars}</span>
                    </div>
                    <p className="text-[10px] opacity-70 truncate">{repo.description || "Building something awesome."}</p>
                  </div>
                ))}
              </div>
            </div>
            <div className="pt-4 border-t border-current border-opacity-20 flex justify-between items-center opacity-60 text-[10px] uppercase tracking-widest">
              <span className="font-bold">Verified GitHub Profile</span>
            </div>
          </div>
        );
      }

      function App() {
        const [username, setUsername] = useState("");
        const [loading, setLoading] = useState(false);
        const [card, setCard] = useState(null);
        const [error, setError] = useState(null);
        const [copied, setCopied] = useState(false);

        const generateCard = async (e) => {
          e.preventDefault();
          if (!username.trim()) return;
          setLoading(true);
          setError(null);
          setCard(null);
          try {
            const response = await fetch(`${BACKEND_URL}/generate`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: username.trim() }),
            });
            if (!response.ok) throw new Error("User not found or API error");
            const res = await response.json();
            if (res.status === "success") setCard(res.data);
            else throw new Error(res.detail || "Failed to generate card");
          } catch (err) { setError(err.message); }
          finally { setLoading(false); }
        };

        const copyToClipboard = () => {
          if (!card) return;
          const shareUrl = `${window.location.origin}?username=${username}`;
          navigator.clipboard.writeText(shareUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        };

        return (
          <div className="flex flex-col items-center space-y-8 py-12">
            <h1 className="text-4xl font-extrabold text-white tracking-tight sm:text-5xl">GitHub Dev Card</h1>
            <form onSubmit={generateCard} className="w-full space-y-4">
              <div className="flex flex-col sm:flex-row gap-3">
                <input type="text" placeholder="e.g. torvalds" className="flex-1 px-4 py-3 rounded-lg bg-[#0d1117] border border-[#30363d] text-white focus:outline-none focus:ring-2 focus:ring-[#2ea043]" value={username} onChange={(e) => setUsername(e.target.value)} disabled={loading} />
                <button type="submit" disabled={loading} className="btn-primary px-8 py-3 rounded-lg text-white font-bold disabled:opacity-50">{loading ? "Analyzing..." : "Generate Card"}</button>
              </div>
            </form>
            {error && <div className="w-full p-4 rounded-lg bg-red-900/20 border border-red-500/50 text-red-200 text-center font-medium">⚠️ {error}</div>}
            {loading && <div className="w-full glass-card p-8 rounded-2xl space-y-6 pulse border border-[#30363d]"><div className="flex items-center space-x-4"><div className="w-20 h-20 bg-gray-800 rounded-full"></div><div className="space-y-3 flex-1"><div className="h-6 bg-gray-800 rounded w-1/2"></div><div className="h-4 bg-gray-800 rounded w-1/3"></div></div></div><div className="h-24 bg-gray-800 rounded-xl w-full"></div></div>}
            {card && <div className="w-full space-y-6 fade-in"><DevCard data={card} /><div className="mt-6 flex justify-center"><button onClick={copyToClipboard} className="px-6 py-2 rounded-full bg-[#21262d] border border-[#30363d] text-sm font-medium hover:bg-[#30363d] transition-colors text-gray-300">{copied ? "Link Copied!" : "Share Card"}</button></div></div>}
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
